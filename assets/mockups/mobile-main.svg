<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1200" width="600" height="1200">
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141412"/><stop offset="100%" stop-color="#0f0f0e"/>
    </linearGradient>
  </defs>
  <!-- Phone frame -->
  <rect x="50" y="0" width="500" height="1200" rx="44" fill="#1a1a18"/>
  <rect x="60" y="10" width="480" height="1180" rx="38" fill="url(#g4)"/>
  <!-- Notch -->
  <rect x="200" y="20" width="200" height="30" rx="15" fill="#1a1a18"/>
  <!-- Status bar -->
  <text x="90" y="50" font-family="monospace" font-size="14" fill="#a09d96">9:41</text>
  <text x="490" y="50" text-anchor="end" font-family="monospace" font-size="11" fill="#a09d96">●●● ▮</text>
  <!-- App header -->
  <rect x="60" y="70" width="480" height="64" fill="#161614"/>
  <text x="120" y="110" font-family="Georgia,serif" font-size="22" fill="#e8dcc8">Focus</text>
  <circle cx="500" cy="102" r="18" fill="#1f1f1d"/>
  <text x="500" y="107" text-anchor="middle" font-family="monospace" font-size="12" fill="#c8b89a">⊞</text>
  <!-- Today header -->
  <text x="90" y="168" font-family="monospace" font-size="11" fill="#6a6762" letter-spacing="3">TODAY</text>
